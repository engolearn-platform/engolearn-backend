components:
  responses:
    InvalidRequest:
      description: INVALID_REQUEST; request body or intent key is invalid.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    AuthenticationRequired:
      description: AUTHENTICATION_REQUIRED; missing or unsupported identity.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    AccessDenied:
      description: ACCESS_DENIED; authenticated principal denied by deployed security policy.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
  schemas:
    AdminScope: {"type":"string","enum":["FREE","TRIAL","PREMIUM"]}
    AdminBenefit: {"type":"object","additionalProperties":false,"required":["code","title","description","displayValue","sortOrder"],"properties":{"code":{"type":"string","minLength":1,"maxLength":128},"title":{"type":"string","minLength":1,"maxLength":200},"description":{"type":"string","minLength":1,"maxLength":2000},"displayValue":{"anyOf":[{"type":"string","maxLength":200},{"type":"null"}]},"sortOrder":{"type":"integer","minimum":0,"maximum":10000}}}
    AdminBillingOption: {"type":"object","additionalProperties":false,"required":["billingPeriod","amount","currency"],"properties":{"billingPeriod":{"type":"string","enum":["MONTHLY","ANNUAL"]},"amount":{"type":"integer","minimum":0,"maximum":9007199254740991},"currency":{"type":"string","pattern":"^[A-Z]{3}$"}}}
    AdminQuotaRule: {"type":"object","additionalProperties":false,"required":["quotaType","displayName","unit","period","limit","displayOrder"],"properties":{"quotaType":{"type":"string","minLength":1,"maxLength":128},"displayName":{"type":"string","minLength":1,"maxLength":200},"unit":{"type":"string","minLength":1,"maxLength":128},"period":{"type":"string","enum":["DAILY","WEEKLY","MONTHLY"]},"limit":{"type":"integer","minimum":0,"maximum":9007199254740991},"displayOrder":{"type":"integer","minimum":0,"maximum":10000}}}
    AdminContent: {"type":"object","additionalProperties":false,"required":["displayName","description","displayOrder","benefits","billingOptions","quotaRules"],"properties":{"displayName":{"type":"string","minLength":1,"maxLength":200},"description":{"anyOf":[{"type":"string","maxLength":2000},{"type":"null"}]},"displayOrder":{"type":"integer","minimum":0,"maximum":10000},"benefits":{"type":"array","items":{"$ref":"#/components/schemas/AdminBenefit"},"maxItems":100},"billingOptions":{"type":"array","items":{"$ref":"#/components/schemas/AdminBillingOption"},"maxItems":2},"quotaRules":{"type":"array","items":{"$ref":"#/components/schemas/AdminQuotaRule"},"maxItems":100,"minItems":1}}}
    AdminPublicationInput: {"type":"object","additionalProperties":false,"required":["expectedRevision","effect","content"],"properties":{"expectedRevision":{"type":"integer","minimum":0,"maximum":9007199254740991},"effect":{"type":"object","additionalProperties":false,"required":["mode","at"],"properties":{"mode":{"type":"string","enum":["NEXT_LOCAL_MIDNIGHT","NOW","AT"]},"at":{"anyOf":[{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},{"type":"null"}]}}},"content":{"$ref":"#/components/schemas/AdminContent"}}}
    AdminVersion: {"type":"object","additionalProperties":false,"required":["scope","version","effectiveAt","status","content"],"properties":{"scope":{"$ref":"#/components/schemas/AdminScope"},"version":{"type":"integer","minimum":1,"maximum":9007199254740991},"effectiveAt":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"status":{"type":"string","enum":["CURRENT","SCHEDULED","HISTORICAL"]},"content":{"$ref":"#/components/schemas/AdminContent"}}}
    AdminConfiguration: {"type":"object","additionalProperties":false,"required":["revision","serverTime","scope","current","pending","activationPending"],"properties":{"revision":{"type":"integer","minimum":0,"maximum":9007199254740991},"serverTime":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"scope":{"$ref":"#/components/schemas/AdminScope"},"current":{"anyOf":[{"$ref":"#/components/schemas/AdminVersion"},{"type":"null"}]},"pending":{"anyOf":[{"$ref":"#/components/schemas/AdminVersion"},{"type":"null"}]},"activationPending":{"type":"boolean"}}}
    AdminCatalog: {"type":"object","additionalProperties":false,"required":["revision","serverTime","timeZone","quotaTypes","scopes"],"properties":{"revision":{"type":"integer","minimum":0,"maximum":9007199254740991},"serverTime":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"timeZone":{"type":"string","const":"Asia/Ho_Chi_Minh"},"quotaTypes":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["quotaType","unit","period"],"properties":{"quotaType":{"type":"string","minLength":1,"maxLength":128},"unit":{"type":"string","minLength":1,"maxLength":128},"period":{"type":"string","enum":["DAILY","WEEKLY","MONTHLY"]}}},"maxItems":100},"scopes":{"type":"array","items":{"$ref":"#/components/schemas/AdminScope"},"maxItems":100}}}
    AdminHistory: {"type":"object","additionalProperties":false,"required":["items","nextBeforeVersion"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/AdminVersion"},"maxItems":50},"nextBeforeVersion":{"anyOf":[{"type":"integer","minimum":1,"maximum":9007199254740991},{"type":"null"}]}}}
    AdminPreview: {"type":"object","additionalProperties":false,"required":["revision","scope","effectiveAt","changedQuotaTypes","impact","content"],"properties":{"revision":{"type":"integer","minimum":0,"maximum":9007199254740991},"scope":{"$ref":"#/components/schemas/AdminScope"},"effectiveAt":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"changedQuotaTypes":{"type":"array","items":{"type":"string","minLength":1,"maxLength":128},"maxItems":100},"impact":{"type":"string","enum":["FREE_CHANGED_TYPES_AT_EFFECTIVE_TIME","NEW_PERIODS_ONLY"]},"content":{"$ref":"#/components/schemas/AdminContent"}}}
    AdminPublicationResult: {"type":"object","additionalProperties":false,"required":["publicationId","scope","version","effectiveAt","acceptedAt","revision"],"properties":{"publicationId":{"type":"string","format":"uuid"},"scope":{"$ref":"#/components/schemas/AdminScope"},"version":{"type":"integer","minimum":1,"maximum":9007199254740991},"effectiveAt":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"acceptedAt":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"},"revision":{"type":"integer","minimum":0,"maximum":9007199254740991}}}
    AdminCatalogResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminCatalog"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    AdminConfigurationResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminConfiguration"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    AdminHistoryResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminHistory"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    AdminVersionResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminVersion"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    AdminPreviewResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminPreview"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    AdminPublicationResultResponse: {"type":"object","additionalProperties":false,"required":["data","timestamp"],"properties":{"data":{"$ref":"#/components/schemas/AdminPublicationResult"},"timestamp":{"type":"string","format":"date-time","description":"UTC instant at millisecond precision"}}}
    TrialActivationApiResponse:
      type: object
      required: [data, timestamp]
      properties:
        timestamp: {type: string, format: date-time}
        data:
          type: object
          required: [trialPeriodId, periodStartAt, periodEndAt, policySnapshotId]
          properties:
            trialPeriodId: {type: string, minLength: 1}
            periodStartAt: {type: string, format: date-time}
            periodEndAt: {type: string, format: date-time}
            policySnapshotId: {type: string, minLength: 1}
    CurrentBenefits:
      type: object
      required: [planCode, displayName, policySnapshotId, benefits]
      properties:
        planCode: {type: string, enum: [FREE, PREMIUM]}
        displayName: {type: string, minLength: 1}
        policySnapshotId: {type: string, minLength: 1}
        benefits:
          type: array
          items: {$ref: '#/components/schemas/PlanBenefit'}
    PlanListApiResponse:
      type: object
      required: [data, timestamp]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlanCard'
        timestamp:
          type: string
          format: date-time

    PlanCard:
      type: object
      required: [planCode, displayName, benefits, billingOptions]
      properties:
        planCode:
          type: string
          description: Stable plan identifier (initial values include FREE and PREMIUM).
          examples: [PREMIUM]
        displayName:
          type: string
          description: User-facing plan name for the current locale.
          examples: [Premium]
        description:
          type: [string, 'null']
          description: Short display description; may be absent.
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/PlanBenefit'
        billingOptions:
          type: array
          description: Empty for a non-purchasable/free plan.
          items:
            $ref: '#/components/schemas/PlanBillingOption'

    PlanBenefit:
      type: object
      required: [code, title, description, sortOrder]
      properties:
        code:
          type: string
          description: Stable benefit key, suitable for analytics and UI mapping.
        title:
          type: string
        description:
          type: string
        displayValue:
          type: [string, 'null']
          description: Optional display value, such as a packaged feature summary.
        sortOrder:
          type: integer
          minimum: 0

    PlanBillingOption:
      type: object
      required: [billingPeriod, amount, currency]
      properties:
        billingPeriod:
          type: string
          enum: [MONTHLY, ANNUAL]
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            Price in the currency's minor unit. The client formats this value
            using currency; it must not infer price from planCode.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code.
          examples: [VND]

    MySubscriptionApiResponse:
      type: object
      required: [data, timestamp]
      properties:
        data:
          $ref: '#/components/schemas/MySubscriptionSummary'
        timestamp:
          type: string
          format: date-time

    MySubscriptionSummary:
      type: object
      required: [tier, status, periodStartAt, periodEndAt, trialEligible, trialIneligibilityReason, currentBenefits]
      properties:
        trialIneligibilityReason:
          type: [string, 'null']
          enum: [null, ALREADY_USED, ACTIVE_PREMIUM]
        currentBenefits:
          $ref: '#/components/schemas/CurrentBenefits'
        tier:
          type: string
          enum: [FREE, PREMIUM]
        status:
          type: string
          enum: [FREE, TRIAL, ACTIVE, EXPIRED, REFUNDED]
          description: Current subscription presentation state; EXPIRED/REFUNDED users may currently fall back to the FREE tier.
        periodStartAt:
          type: [string, 'null']
          format: date-time
        periodEndAt:
          type: [string, 'null']
          format: date-time
        trialEligible:
          type: boolean
          description: Whether the user is currently eligible to activate the one-time Trial under Subscription rules.

    QuotaUsageApiResponse:
      type: object
      required: [data, timestamp]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuotaUsageItem'
        timestamp:
          type: string
          format: date-time

    QuotaUsageItem:
      type: object
      required:
        - quotaType
        - displayName
        - used
        - limit
        - remaining
        - unit
        - period
        - windowStartAt
        - windowEndsAt
        - allowanceStartAt
        - status
      properties:
        quotaType:
          type: string
          description: Stable, extensible quota identifier; clients must not assume the catalog is closed.
          examples: [SPEAKING_DURATION]
        displayName:
          type: string
          description: User-facing display name resolved for the current locale.
          examples: [Thời lượng luyện nói với AI]
        used:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Actual recorded usage in the canonical unit; may exceed limit for post-action usage.
        limit:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        remaining:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: max(0, limit - used); never negative.
        overLimitAmount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Optional; present when used > limit and equals used - limit.
        unit:
          type: string
          description: Canonical unit for quotaType; initial values include SECOND and ATTEMPT.
          examples: [SECOND]
        period:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        windowStartAt:
          type: string
          format: date-time
          description: Start of the current calendar period, in UTC.
        allowanceStartAt:
          type: string
          format: date-time
          description: Counted allowance start; may be later than calendar start after a delivered Free policy activation.
        windowEndsAt:
          type: string
          format: date-time
          description: End of the current calendar period, in UTC; it does not imply policy activation cannot reset allowance earlier.
        status:
          type: string
          enum: [AVAILABLE, EXHAUSTED, OVER_LIMIT]
          description: AVAILABLE when remaining > 0; EXHAUSTED when used = limit; OVER_LIMIT when used > limit.

    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance, code]
      description: RFC 9457/ProblemDetail-style error response used by the backend.
      properties:
        code:
          type: string
          description: Stable endpoint error code; storage errors and personal data are never exposed.
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
