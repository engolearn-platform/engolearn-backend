openapi: 3.1.0
info:
  title: Subscription and Quota Learner API
  version: 1.0.0
  description: |
    Frozen M1/M2 learner contract. Every response uses Cache-Control: no-store.
    Identity comes from the authenticated principal; no user selector is accepted.
    All timestamps are UTC instants; calendar windows use Asia/Ho_Chi_Minh.
    Quota's consume/checkAvailability/recordUsage
    operations are in-process backend contracts and are not exposed to the client.
  x-review-status: IMPLEMENTATION_CONTRACT

servers:
  - url: /

tags:
  - name: Subscription
    description: Published plan information and the current user's subscription state.
  - name: Quota
    description: Current quota usage overview for the authenticated user.

paths:
  /api/v1/subscription/me/trial:
    post:
      tags: [Subscription]
      operationId: activateMyTrial
      summary: Explicitly activate the one-time seven-day Trial
      x-auth-requirement: authenticated-user
      description: |
        Accepted receipts are checked before current eligibility. Same active Trial
        with a new key returns its original values and records that accepted intent.
        Replay never extends the Trial and does not claim it remains active now.
        Refetch subscription and quota reads after every accepted response.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        '201':
          description: Trial created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrialActivationApiResponse'}
        '200':
          description: Accepted replay or the original already-active Trial.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrialActivationApiResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: IDEMPOTENCY_CONFLICT, TRIAL_ALREADY_USED or PREMIUM_ALREADY_ACTIVE.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '503':
          description: SUBSCRIPTION_STATE_UNAVAILABLE; history/configuration or commit cannot be confirmed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/subscription/plans:
    get:
      tags: [Subscription]
      operationId: listPublishedPlans
      summary: List plans available for display
      description: |
        Returns the currently published plan cards and display-ready benefit
        metadata. Prices and benefits come from Subscription configuration, not
        hard-coded frontend constants. This read endpoint does not start a trial
        or create a payment request.
      responses:
        '200':
          description: Published plans loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListApiResponse'
        '503':
          description: Plan configuration is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/subscription/me:
    get:
      tags: [Subscription]
      operationId: getMySubscriptionSummary
      x-error-codes: [AUTHENTICATION_REQUIRED, ACCESS_DENIED, SUBSCRIPTION_STATE_UNAVAILABLE]
      summary: Get the current user's subscription summary
      description: |
        Requires an authenticated user. No user identifier is accepted from the
        caller. Used to display the current tier/status and whether the Trial CTA
        is available. This response intentionally does not expose a generic
        lifetime-content-access flag: resource access policy belongs to the
        module that owns that resource.
      x-auth-requirement: authenticated-user
      responses:
        '200':
          description: Current subscription summary loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubscriptionApiResponse'
        '403': {$ref: '#/components/responses/AccessDenied'}
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Subscription state is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/quota/me/usage:
    get:
      tags: [Quota]
      operationId: getMyQuotaUsage
      x-error-codes: [AUTHENTICATION_REQUIRED, ACCESS_DENIED, QUOTA_SUMMARY_UNAVAILABLE]
      summary: Get the current user's quota usage overview
      description: |
        Requires an authenticated user. Returns one item per quota applicable
        to the user's current quota entitlement, in one request. Values use
        each quota type's canonical unit; timestamps are instants in UTC and
        represent boundaries computed in Asia/Ho_Chi_Minh.
        
        Do not fabricate usage as zero if the policy or counter state cannot be
        confirmed. Return an unavailable error so the UI can show an explicit
        unavailable state instead of displaying misleading figures.
      x-auth-requirement: authenticated-user
      responses:
        '200':
          description: Quota usage overview loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaUsageApiResponse'
        '403': {$ref: '#/components/responses/AccessDenied'}
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Current policy or usage data cannot be confirmed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

