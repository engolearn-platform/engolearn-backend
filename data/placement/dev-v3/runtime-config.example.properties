# Optional LOCAL example. Root .env supplies the existing development connection.
# Do not point this configuration at production. DRAFT access is dev-only.
server.port=8080
spring.profiles.active=dev
spring.mongodb.host=${MONGO_HOST:127.0.0.1}
spring.mongodb.port=${MONGO_PORT:27019}
spring.mongodb.database=${APP_DB:engolearn_placement_dev_v3}
spring.mongodb.username=${APP_USER}
spring.mongodb.password=${APP_PASSWORD}
engolearn.security.jwt.secret=${AUTH_JWT_SECRET}
engolearn.placement.persistence.mode=mongo
engolearn.placement.test-set.allow-draft=true
# Required for real Auth registration after main's Subscription initialization.
engolearn.mongodb.transactions.enabled=true
