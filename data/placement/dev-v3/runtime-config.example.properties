# PROPOSAL ONLY. Do not activate until the target/environment is explicitly approved.
# Load for a SEPARATE Backend process; never point the team's existing process here.
server.port=8082
spring.profiles.active=dev
spring.mongodb.uri=mongodb://127.0.0.1:27017/engolearn_placement_dev_v3
spring.mongodb.database=engolearn_placement_dev_v3
spring.mongodb.username=
spring.mongodb.password=
engolearn.security.jwt.secret=${AUTH_JWT_SECRET}
engolearn.placement.persistence.mode=mongo
engolearn.placement.test-set.allow-draft=true

# Standalone candidate: does NOT enable Auth/User transaction-dependent operations.
# Registration/User-flow validation remains blocked pending the environment owner's decision.
engolearn.mongodb.transactions.enabled=false

# Avoid the generic startup guard creating every module's collections in this proposed DB.
# Other modules still share this MongoTemplate; this is environment isolation, not feature routing.
engolearn.mongodb.bootstrap.enabled=false
