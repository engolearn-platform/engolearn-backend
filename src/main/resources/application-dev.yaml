engolearn:
  security:
    cookies:
      secure: ${AUTH_COOKIE_SECURE:false}
  development:
    speaking-fixture-enabled: ${DEV_SPEAKING_FIXTURE_ENABLED:false}
  placement:
    test-set:
      allow-draft: ${PLACEMENT_ALLOW_DRAFT:false}
    media-directory: ${PLACEMENT_MEDIA_DIRECTORY:./tools/mongo-json-importer/samples/placement-media}
  assessment:
    media-directory: ${ASSESSMENT_MEDIA_DIRECTORY:./tools/mongo-json-importer/samples/assessment-media}
  speaking:
    dev-seed-file: ${SPEAKING_DEV_SEED_FILE:}
  payment:
    dev-reset:
      enabled: ${PAYMENT_DEV_RESET_ENABLED:false}
    vnpay:
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

logging:
  level:
    fit.iuh.engolearn: ${DEV_LOG_LEVEL:INFO}
