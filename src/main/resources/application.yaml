server:
  port: 8080

spring:
  application:
    name: engolearn
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${APP_DB:engolearn_db}
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}

engolearn:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mongodb:
    server-selection-timeout-ms: 2000
  security:
    dev-auth:
      enabled: true
  media:
    cloudinary:
      url: ${CLOUDINARY_URL:}
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  speaking:
    assemblyai:
      api-key: ${ASSEMBLYAI_API_KEY:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    cartesia:
      api-key: ${CARTESIA_API_KEY:}
      voice: ${CARTESIA_VOICE_ID:db6b0ed5-d5d3-463d-ae85-518a07d3c2b4}
    dev-seed-file: ${SPEAKING_DEV_SEED_FILE:}

