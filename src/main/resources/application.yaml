server:
  port: 8080

spring:
  application:
    name: engolearn
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${APP_DB:engolearn_db}
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}

engolearn:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mongodb:
    server-selection-timeout-ms: 2000
  security:
    dev-auth:
      enabled: false


  topic:
    local-learner-id: ${TOPIC_LOCAL_LEARNER_ID:}

  payment:
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      worker-enabled: ${VNPAY_WORKER_ENABLED:true}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:}
      server-ip: ${VNPAY_SERVER_IP:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
