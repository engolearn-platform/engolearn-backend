server:
  port: 8080

spring:
  application:
    name: engolearn
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_SIZE_BYTES:26214400}B
      max-request-size: ${MEDIA_MAX_MULTIPART_REQUEST_SIZE_BYTES:31457280}B
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI}
    database: ${APP_DB:engolearn_db}

engolearn:
  placement:
    persistence:
      mode: mongo
    test-set:
      allow-draft: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mongodb:
    server-selection-timeout-ms: 2000
    transactions:
      enabled: true
  security:
    jwt:
      secret: ${AUTH_JWT_SECRET}
      issuer: ${AUTH_JWT_ISSUER:engolearn}
    cookies:
      secure: true
  media:
    max-upload-size-bytes: ${MEDIA_MAX_UPLOAD_SIZE_BYTES:26214400}
    max-image-upload-size-bytes: ${MEDIA_MAX_IMAGE_UPLOAD_SIZE_BYTES:10000000}
    protected-url-lifetime: ${MEDIA_PROTECTED_URL_LIFETIME:60s}
    cloudinary:
      url: ${CLOUDINARY_URL:}
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  speaking:
    assemblyai:
      api-key: ${ASSEMBLYAI_API_KEY:}
      endpoint: ${SPEAKING_ASSEMBLYAI_ENDPOINT:wss://streaming.assemblyai.com/v3/ws}
      model: ${SPEAKING_ASSEMBLYAI_MODEL:universal-3-6-pro}
      connect-timeout: ${SPEAKING_ASSEMBLYAI_CONNECT_TIMEOUT:10s}
      finalization-timeout: ${SPEAKING_ASSEMBLYAI_FINALIZATION_TIMEOUT:6s}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      endpoint: ${SPEAKING_GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
      model: ${SPEAKING_GEMINI_MODEL:gemini-3.5-flash-lite}
      conversation-timeout: ${SPEAKING_GEMINI_CONVERSATION_TIMEOUT:12s}
      opening-timeout: ${SPEAKING_GEMINI_OPENING_TIMEOUT:10s}
    cartesia:
      api-key: ${CARTESIA_API_KEY:}
      voice: ${CARTESIA_VOICE_ID:db6b0ed5-d5d3-463d-ae85-518a07d3c2b4}
      model: ${SPEAKING_CARTESIA_MODEL:sonic-3.6}
      endpoint: ${SPEAKING_CARTESIA_ENDPOINT:https://api.cartesia.ai/tts/bytes}
      api-version: ${SPEAKING_CARTESIA_API_VERSION:2026-08-14}
      timeout: ${SPEAKING_CARTESIA_TIMEOUT:20s}
    realtime:
      workers: ${SPEAKING_REALTIME_WORKERS:4}
      queue-capacity: ${SPEAKING_REALTIME_QUEUE_CAPACITY:24}
      max-connections: ${SPEAKING_REALTIME_MAX_CONNECTIONS:128}
      max-frames-per-second: ${SPEAKING_REALTIME_MAX_FRAMES_PER_SECOND:160}
      max-commands-per-second: ${SPEAKING_REALTIME_MAX_COMMANDS_PER_SECOND:16}
    azure:
      enabled: ${SPEAKING_AZURE_ENABLED:true}
      api-key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:}
    assessment:
      audio-workers: ${SPEAKING_ASSESSMENT_AUDIO_WORKERS:1}
      audio-queue-capacity: ${SPEAKING_ASSESSMENT_AUDIO_QUEUE_CAPACITY:50}
      audio-timeout: ${SPEAKING_ASSESSMENT_AUDIO_TIMEOUT:20s}
      audio-transient-retries: ${SPEAKING_ASSESSMENT_AUDIO_TRANSIENT_RETRIES:1}
      audio-deadline: ${SPEAKING_ASSESSMENT_AUDIO_DEADLINE:30s}
      language-enabled: ${SPEAKING_ASSESSMENT_LANGUAGE_ENABLED:true}
      language-timeout: ${SPEAKING_ASSESSMENT_LANGUAGE_TIMEOUT:30s}
    indexes:
      enabled: true
    recovery:
      enabled: true

  payment:
    dev-reset:
      enabled: false
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      worker-enabled: ${VNPAY_WORKER_ENABLED:true}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:}
      server-ip: ${VNPAY_SERVER_IP:}
      pay-url: ${VNPAY_PAY_URL:}
      api-url: ${VNPAY_API_URL:}

# Keep the operational HTTP surface minimal; readiness excludes external services by default.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
