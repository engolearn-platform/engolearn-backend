server:
  port: 8080

spring:
  application:
    name: engolearn
  config:
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${APP_DB:engolearn_db}
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}

# CORS configuration
# The frontend dev server runs on a different origin; allowed origins are config-driven
# so staging/production can override without code changes.
engolearn:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
