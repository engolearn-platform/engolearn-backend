server:
  port: 8080

spring:
  application:
    name: engolearn
  config:
    import: optional:file:.env[.properties]
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${APP_DB:engolearn_db}
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}
  data:
    mongodb:
      # Disclosed config step (design §3.6 / VF-02): annotated indexes are inert without this.
      auto-index-creation: true
  jackson:
    deserialization:
      # DEC-21: reject unknown/forbidden request-body fields with 400 instead of ignoring them.
      fail-on-unknown-properties: true